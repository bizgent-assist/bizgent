[package]
name = "bizgent-vault"
description = "Bizgent central vault: logically isolated business USDC balances with owner authority and policy-limited agent payments"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/bizgent/bizgent"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1" }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
