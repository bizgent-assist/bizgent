# Builds and tests the vault contract on Linux. Needed because the development Windows
# machine runs Smart App Control, which blocks locally compiled Rust build scripts.
# The wasm artifact is downloaded with:  gh run download --name bizgent-vault-wasm -D contracts/vault/target/near
name: contract

on:
  push:
    paths: ['contracts/**', '.github/workflows/contract.yml']
  pull_request:
    paths: ['contracts/**']
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/vault
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/vault/target
          key: vault-${{ runner.os }}-${{ hashFiles('contracts/vault/Cargo.lock', 'contracts/vault/Cargo.toml') }}
      - name: Unit tests
        run: cargo test --locked || cargo test
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        run: cargo near build non-reproducible-wasm
      - name: Show artifact
        run: ls -la target/near && sha256sum target/near/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bizgent-vault-wasm
          path: |
            contracts/vault/target/near/bizgent_vault.wasm
            contracts/vault/target/near/bizgent_vault_abi.json
          if-no-files-found: error
